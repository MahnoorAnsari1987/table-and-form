<body>
    <h1> sum numbers 1to 10</h1>
    <script>
        let sum = 0;
        for(let i = 1; i <= 10; i++){
             sum = sum + i;
        }
        console.log("sum: " + sum);

            
          for(let i = 1; i <= 100; i++ ){
            sum += i;
        }
        console.log("sum: " + sum);
    </script>
</body>

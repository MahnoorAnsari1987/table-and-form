<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for(let table = 1; table <= 5; table ++){
            console.log("=====" + table + "=====" );
            for(let i = 1; i <= 10; i ++ ){
                console.log(table + " x " + i + " = " + (table * i));
            }
            console.log(" ");
        }
    </script>
</body>
</html>

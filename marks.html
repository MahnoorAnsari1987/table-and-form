<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> grade calculator</h1>
    <script>
        let marks = (prompt("enter marks"));
        if (marks>= 90 && marks <= 100){
            console.log("A+");
        }
         else if (marks >=80){
            console.log("A");
         }
         else if (marks >=70){
            console.log("B");
         }
         else if (marks >=60){
            console.log("c");
         }
         else {
            console.log("f");
         } 


    


</script>
</body>
</html>

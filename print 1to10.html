<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1> print 1 to 10 </h1>
    <h2> print 10 to 1 </h2>
    </h3> print 1 to 20 </h3>
    <script>
        for (let i = 1 ; i <=  10 ;i ++){
            console.log (i);
        }
        for (let i = 10; i >= 1; i--  ){
            console.log(i);
        }
        for (let i = 1; i <= 20; i ++){
            console.log(i);
        }
    </script>
    
</body>
</html>
